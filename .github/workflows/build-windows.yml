name: Build Windows Release

# Windows build sanity check on branches. The actual tagged release (for all
# platforms) is produced by release.yml.
on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: desktop-app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - name: Install dependencies
        working-directory: desktop-app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: desktop-app
        run: pnpm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: localhost-manager-windows-nsis
          path: desktop-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: localhost-manager-windows-msi
          path: desktop-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      # Tagged releases are handled by release.yml (single release for all
      # platforms). This workflow only validates the Windows build on branches.

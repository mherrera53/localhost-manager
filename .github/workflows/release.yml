name: Release

# Builds the desktop app for macOS (.dmg) and Windows (.exe/.msi) and publishes
# a single GitHub Release when a v* tag is pushed (e.g. v1.0.0).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust-targets: 'x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows is BETA: at least fail fast if any PowerShell script has a
      # syntax error before spending time on the full Tauri build.
      - name: Lint PowerShell scripts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts/windows -Filter *.ps1 -Recurse | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs -and $errs.Count -gt 0) {
              Write-Host "PARSE ERRORS in $($_.Name):"
              $errs | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            } else {
              Write-Host "OK  $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: desktop-app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop-app
        run: pnpm install --frozen-lockfile

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (Developer ID). Empty on Windows -> ignored.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # macOS notarization. Add these secrets (Apple ID + app-specific
          # password) to enable; without them the build is signed but not
          # notarized.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop-app
          tagName: ${{ github.ref_name }}
          releaseName: 'Localhost Manager ${{ github.ref_name }}'
          releaseBody: |
            Localhost Manager ${{ github.ref_name }}

            Artifacts:
            - macOS: universal .dmg
            - Windows: .exe (NSIS) and .msi

            [!] Windows support is BETA. The PowerShell scripts and the
            macOS/Windows command wiring were ported but have not yet been
            tested on a real Windows machine. Please report issues.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action staples the .app; this notarizes + staples the .dmg
      # container too, so even the first open of the downloaded .dmg works
      # offline (no online Gatekeeper check needed).
      - name: Notarize and staple the DMG (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "No notarization credentials; skipping DMG staple."
            exit 0
          fi
          DMG=$(find desktop-app/src-tauri/target -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then echo "No DMG found; skipping."; exit 0; fi
          echo "Stapling DMG: $DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber -R "${{ github.repository }}"
